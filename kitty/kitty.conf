# Kitty main config. Mirrors the Ghostty setup: FiraCode Nerd Font,
# Catppuccin Mocha, no title-bar clutter, login zsh.
#
# Cmd handling: a terminal can't carry the Cmd modifier itself, so the maps
# below translate Cmd combos into CSI-u with the super modifier, which
# Neovim decodes straight to its <D-...> maps (see nvim
# lua/config/keymaps.lua). (The old private 9xx sequences stopped reaching
# mappings in Neovim 0.12, which consumes raw CSI `~` input.) Kitty user
# maps replace the same-trigger defaults outright, so one map per combo is
# enough (no Ghostty-style bare-form unbinds needed).

font_family "FiraCode Nerd Font"
font_size 16.0

# Palette is Catppuccin Mocha (color0-15).
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc
cursor #f5e0dc
cursor_text_color #1e1e2e
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# Hide the titlebar, keep window controls (like Ghostty's hidden style).
hide_window_decorations titlebar-only
# Left Option acts as Alt (like Ghostty): without this, Option
# sends accented chars and every Alt-hjkl / Alt+digit map in Neovim
# silently fails. Right Option still types special characters.
macos_option_as_alt left

# Blinking block cursor.
cursor_shape block
cursor_blink_interval 0.5

# Padding between text and window border.
window_padding_width 8

# Login zsh (reads .zprofile/.zshrc, so mise shims
# and PATH are present for nvim, LSP servers, etc.).
shell /bin/zsh -l

# Wire kitty to Neovim: scrollback/hints/config editing all open in nvim.
editor nvim

# Prompt marks, cwd-aware tabs, Cmd-clickable paths/URLs.
shell_integration enabled

# Bank A: Cmd+1..0 -> current slot's terminals (nvim <D-1>..<D-0>).
# Replaces kitty's defaults on the same triggers (first_window..ninth_window).
map cmd+1 send_text all \e[49;9u
map cmd+2 send_text all \e[50;9u
map cmd+3 send_text all \e[51;9u
map cmd+4 send_text all \e[52;9u
map cmd+5 send_text all \e[53;9u
map cmd+6 send_text all \e[54;9u
map cmd+7 send_text all \e[55;9u
map cmd+8 send_text all \e[56;9u
map cmd+9 send_text all \e[57;9u
map cmd+0 send_text all \e[48;9u

# Bank B: Cmd+Shift+1..0 -> select project slot (nvim <D-S-1>..<D-S-0>).
# Bonus family where macOS lets it through (Cmd+Shift+3/4/5 are system
# screenshots and never reach any terminal).
map cmd+shift+1 send_text all \e[49;10u
map cmd+shift+2 send_text all \e[50;10u
map cmd+shift+3 send_text all \e[51;10u
map cmd+shift+4 send_text all \e[52;10u
map cmd+shift+5 send_text all \e[53;10u
map cmd+shift+6 send_text all \e[54;10u
map cmd+shift+7 send_text all \e[55;10u
map cmd+shift+8 send_text all \e[56;10u
map cmd+shift+9 send_text all \e[57;10u
map cmd+shift+0 send_text all \e[48;10u

# Cmd+letter maps (nvim <D-p>/<D-o>/<D-w>/<D-S-f>/<D-S-z>/<D-z>/<D-e>/<D-S-e>).
map cmd+p send_text all \e[112;9u
map cmd+o send_text all \e[111;9u
# Cmd+W closes nvim's current buffer, or the tab when the buffer is
# empty (nvim <D-w> -> buffer_close, tabclose only), never the window —
# parity with Ghostty (escalating close there too: Shift+Cmd+W the tab,
# Ctrl+Shift+Cmd+W the window).
map cmd+w send_text all \e[119;9u
map shift+cmd+w close_tab
map ctrl+shift+cmd+w close_window
map cmd+shift+f send_text all \e[70;10u
# Shift+Alt+F formats (nvim <A-S-f>, VSCode format-document) — parity
# with Ghostty (Cmd+Shift+F above stays search, different modifier).
map alt+shift+f send_text all \e[70;4u
map cmd+shift+z send_text all \e[90;10u
map cmd+z send_text all \e[122;9u
# Cmd+E focuses the Neovim file tree (nvim <D-e>), Shift+Cmd+E peeks
# it (nvim <D-S-e>, cursor stays in code) — parity with Ghostty.
map cmd+e send_text all \e[101;9u
map cmd+shift+e send_text all \e[101;10u
# Cmd+Delete (Backspace) trashes the nvim-tree node under the cursor
# (nvim <D-BS> -> api.fs.trash, Finder parity) — parity with Ghostty.
map cmd+backspace send_text all \e[127;9u

# Slot select on Cmd+Ctrl+digits (nvim <D-C-1>..<D-C-0>). This family owns
# slot switching since Cmd+Shift+3/4/5 never arrive.
map cmd+ctrl+1 send_text all \e[49;13u
map cmd+ctrl+2 send_text all \e[50;13u
map cmd+ctrl+3 send_text all \e[51;13u
map cmd+ctrl+4 send_text all \e[52;13u
map cmd+ctrl+5 send_text all \e[53;13u
map cmd+ctrl+6 send_text all \e[54;13u
map cmd+ctrl+7 send_text all \e[55;13u
map cmd+ctrl+8 send_text all \e[56;13u
map cmd+ctrl+9 send_text all \e[57;13u
map cmd+ctrl+0 send_text all \e[48;13u
